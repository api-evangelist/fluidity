aid: fluidity
name: Fluidity
description: >-
  Fluidity Money is a decentralized finance (DeFi) protocol that turns idle
  crypto into "Fluid Assets" (fAssets) — ERC-20-compatible wrapped tokens on
  Ethereum/Arbitrum and SPL tokens on Solana that pay instant, probabilistic
  rewards every time they are transferred (the Transfer Reward Function). Yield
  is sourced from lending protocols such as Compound and AAVE on Ethereum and
  Solend on Solana, and distributed through "utility mining." Fluidity exposes a
  public GraphQL API over its webapp and landing-page data, publishes EVM ABIs
  and Solana program/account structures for on-chain integration, and is
  governed by the $FLY token. Fluidity Labs sunsetted active protocol
  development on 2026-04-01 to focus on the Superposition ecosystem; docs,
  status page, and on-chain contracts remain live.
